server {
  listen 80 default_server;
  server_name 1.12.67.229;

  if ($host != "1.12.67.229") {
    return 444;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/letsencrypt;
    try_files $uri =404;
  }

  location = /legacy-import.html {
    root /opt/daily-study/current;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy
      "default-src 'self'; frame-ancestors 'none'";
  }

  location = /legacy-import.js {
    root /opt/daily-study/current;
    add_header Cache-Control "no-store";
  }

  location / {
    return 308 https://1.12.67.229$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  server_name 1.12.67.229;

  ssl_certificate /etc/letsencrypt/live/1.12.67.229/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/1.12.67.229/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 512k;

  if ($host != "1.12.67.229") {
    return 444;
  }

  location ~ /\. {
    return 404;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
  }
}
